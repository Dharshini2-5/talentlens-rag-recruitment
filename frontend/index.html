<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentLens AI — Recruitment Assistant &amp; Smart RAG Chatbot</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("talentlens_theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.classList.remove("dark", "light");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-violet-500/35 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
